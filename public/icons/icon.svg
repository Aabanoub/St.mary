<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f3220"/>
      <stop offset="50%" stop-color="#68432b"/>
      <stop offset="100%" stop-color="#3b2416"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Circle with Gold Border -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="8"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="#be9877" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Church Dome / Arch Silhouette -->
  <path d="M156 360 L156 240 C156 160, 256 120, 256 120 C256 120, 356 160, 356 240 L356 360 Z" 
        fill="#3b2416" opacity="0.6" filter="url(#shadow)"/>

  <!-- Coptic Cross in Gold -->
  <g transform="translate(256, 210)" filter="url(#shadow)">
    <!-- Vertical beam -->
    <rect x="-14" y="-80" width="28" height="160" rx="6" fill="url(#goldGrad)"/>
    <!-- Horizontal beam -->
    <rect x="-70" y="-14" width="140" height="28" rx="6" fill="url(#goldGrad)"/>
    <!-- Decorative End Triangles / Cross Finials -->
    <circle cx="0" cy="-80" r="10" fill="url(#goldGrad)"/>
    <circle cx="0" cy="80" r="10" fill="url(#goldGrad)"/>
    <circle cx="-70" cy="0" r="10" fill="url(#goldGrad)"/>
    <circle cx="70" cy="0" r="10" fill="url(#goldGrad)"/>
    <!-- Center halo -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
    <circle cx="0" cy="0" r="8" fill="#fef3c7"/>
  </g>

  <!-- Open Bible below Cross -->
  <g transform="translate(256, 340)">
    <path d="M-90 -10 C-45 -25, -10 -15, 0 0 C10 -15, 45 -25, 90 -10 L90 40 C45 25, 10 35, 0 50 C-10 35, -45 25, -90 40 Z" 
          fill="#fbf8f5" stroke="#be9877" stroke-width="3"/>
    <!-- Bible Bookmark Ribbon -->
    <path d="M0 0 L0 65 L8 58 L16 65 L16 0 Z" fill="#b45309"/>
  </g>

  <!-- Arabic Typography Sub-banner -->
  <text x="256" y="445" font-family="'Cairo', 'Tajawal', sans-serif" font-size="28" font-weight="bold" fill="#fde68a" text-anchor="middle" letter-spacing="1">
    كنيسة السيدة العذراء مريم
  </text>
  <text x="256" y="475" font-family="'Cairo', 'Tajawal', sans-serif" font-size="20" font-weight="600" fill="#dbc2ad" text-anchor="middle">
    إعداد خدام
  </text>
</svg>
